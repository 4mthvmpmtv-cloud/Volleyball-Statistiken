<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Volleyball-Statistik</title><style>*{box-sizing:border-box}body{font:15px system-ui;background:#eef4ef;color:#173323;margin:10px}h1{background:#174b35;color:white;padding:12px;border-radius:10px;font-size:22px}button{font:inherit;touch-action:manipulation;border:1px solid #ccd9ce;border-radius:7px;padding:8px;background:white}table{border-spacing:0;min-width:1300px;width:100%;text-align:center}th,td{padding:4px;border:1px solid #d5e0d7;min-width:72px;background:white}th{background:#dce9df}tr>*:first-child{position:sticky;left:0;background:#e5eee6;z-index:2;text-align:left}.plus{background:#246b49;color:white;width:100%;min-height:44px;font-size:20px;font-weight:bold}.minus{width:100%;margin-top:3px;padding:4px;min-height:28px}.wrap{overflow:auto}nav{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}input,select{font:inherit;padding:9px;border:1px solid #ccd9ce;border-radius:7px;max-width:100%}#analysis{background:white;padding:14px;border-radius:10px}.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}.chart{border:1px solid #d5e0d7;padding:12px;border-radius:9px}.bar{height:22px;background:#edf1ee;border-radius:4px;overflow:hidden;display:flex}.bar span{height:100%}.metric{display:flex;justify-content:space-between;gap:8px;margin:8px 0 3px}.manage{display:flex;gap:4px;margin-top:5px}.manage button{padding:4px;font-size:12px}.active{background:#174b35;color:white} [hidden]{display:none!important} .match{display:flex;flex-wrap:wrap;gap:12px;align-items:end;background:white;padding:12px;border-radius:10px;margin-bottom:12px}.match label{display:grid;gap:4px}.score{width:85px} @media print{@page{size:A4;margin:12mm}body{background:white;margin:0;color:black}nav,#capture,#pdf,#whoLabel,.match{display:none!important}#analysis{display:block!important;padding:0}h1{background:white;color:black;padding:0}.charts{display:grid;grid-template-columns:1fr 1fr;gap:8px}.chart{break-inside:avoid;padding:8px}.bar,.bar span{-webkit-print-color-adjust:exact;print-color-adjust:exact}.metric{margin:4px 0 2px}h3{margin:5px 0}}</style><h1>SV Lauchheim – Spielstatistik</h1><nav><button id="entry" class="active">Spielerfassung</button><button id="report">Auswertung</button></nav><div class="match"><label>Spielname<input id="matchName" placeholder="z. B. SV Lauchheim – Essingen"></label><label>Eigene Punkte<input class="score" id="home" type="number" min="0" step="1" inputmode="numeric"></label><label>Gegnerpunkte<input class="score" id="away" type="number" min="0" step="1" inputmode="numeric"></label></div><section id="capture"><nav><form id="addform"><input id="player" maxlength="60" placeholder="Spielername" required><button>+ Spieler hinzufügen</button></form></nav><nav><button id="reset">Spiel zurücksetzen</button><button id="export">CSV exportieren</button><span id="status"></span></nav><p>Grün = +1. Minus = −1. Seitlich wischen für weitere Felder.</p><div class="wrap"><table id="board"></table></div></section><section id="analysis" hidden><h2>Spielauswertung</h2><h3 id="matchReport"></h3><p id="personReport"></p><button id="pdf">Auswertung als PDF speichern</button><label id="whoLabel">Ansicht <select id="who"></select></label><p id="summary"></p><div class="charts" id="charts"></div></section><script>
const g=[['Aufschlag',['Fehler','Mittel','Gut','ASS']],['Zuspiel',['Schlecht','Mittel','Gut','Erhalten']],['Angriff',['Erfolgreich','Erfolglos']],['Annahme',['Schlecht','Mittel','Gut']],['Block',['Schlecht','Angriff gelenkt','Killblock']]],f=g.flatMap(([n,a])=>a.map(s=>n+' - '+s)),zero=()=>f.map(()=>0),key='volleyball-roster-v2',$=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let p=[],d=[];let match={name:"",home:"",away:""};try{match={...match,...JSON.parse(localStorage.getItem("volleyball-match-v1"))}}catch(e){}
function clean(r){return zero().map((v,j)=>Math.max(0,Math.floor(Number(r?.[j])||0)))}
try{let s=JSON.parse(localStorage.getItem(key));if(s&&Array.isArray(s.p)&&Array.isArray(s.d)){p=s.p.map(String);d=p.map((n,i)=>clean(s.d[i]))}else{let legacy=JSON.parse(localStorage.getItem('volleyball-v1'));if(Array.isArray(legacy)&&legacy.some(r=>Array.isArray(r)&&r.some(v=>Number(v)>0))){p=['Raffi','Leon','Samuel','Luis','Sophie','Annika','Laila'];d=p.map((n,i)=>clean(legacy[i]))}}}catch(e){}
function save(){try{localStorage.setItem(key,JSON.stringify({p,d}));$('status').textContent='Lokal gespeichert'}catch(e){$('status').textContent='Speicherung nicht verfügbar'}}
function render(){let selected=$('who').value;$('who').innerHTML='<option value="all">Gesamte Mannschaft</option>'+p.map((n,i)=>'<option value="'+i+'">'+esc(n)+'</option>').join('');if([...$('who').options].some(o=>o.value===selected))$('who').value=selected;
$('board').innerHTML='<thead><tr><th rowspan="2">Spieler</th>'+g.map(([n,a])=>'<th colspan="'+a.length+'">'+n+'</th>').join('')+'</tr><tr>'+g.flatMap(([n,a])=>a.map(s=>'<th>'+s+'</th>')).join('')+'</tr></thead><tbody>'+p.map((n,i)=>'<tr><th>'+esc(n)+'<div class="manage"><button data-edit="'+i+'">Name</button><button data-remove="'+i+'">Entfernen</button></div></th>'+f.map((s,j)=>'<td><button class="plus" data-i="'+i+'" data-j="'+j+'" data-d="1"><span id="v'+i+'_'+j+'">0</span> +</button><button class="minus" data-i="'+i+'" data-j="'+j+'" data-d="-1">−</button></td>').join('')+'</tr>').join('')+'</tbody><tfoot><tr><th>Gesamt</th>'+f.map((s,j)=>'<td id="t'+j+'">0</td>').join('')+'</tr></tfoot>';refresh()}
function refresh(){d.forEach((r,i)=>r.forEach((v,j)=>$('v'+i+'_'+j).textContent=v));f.forEach((s,j)=>$('t'+j).textContent=d.reduce((n,r)=>n+r[j],0));save();if(!$('analysis').hidden)charts()}
$('addform').onsubmit=e=>{e.preventDefault();let n=$('player').value.trim();if(!n)return;p.push(n);d.push(zero());$('player').value='';render()};
$('board').onclick=e=>{let b=e.target.closest('button');if(!b)return;let {i,j,d:delta,edit,remove}=b.dataset;if(delta!==undefined){d[i][j]=Math.max(0,d[i][j]+Number(delta));refresh()}else if(edit!==undefined){let n=prompt('Spielername',p[edit]);if(n&&n.trim()){p[edit]=n.trim();render()}}else if(remove!==undefined&&confirm(p[remove]+' samt Statistik entfernen?')){p.splice(Number(remove),1);d.splice(Number(remove),1);render()}};
$('reset').onclick=()=>{if(confirm('Alle Zähler zurücksetzen? Spielernamen bleiben erhalten.')){d=p.map(zero);match.home="";match.away="";syncMatch();saveMatch();refresh()}};
$('export').onclick=()=>{let quote=v=>'"'+String(v).replace(/"/g,'""')+'"';let rows=[['Spieler',...f],...p.map((n,i)=>[n,...d[i]])];let u=URL.createObjectURL(new Blob(['\uFEFF'+rows.map(r=>r.map(quote).join(';')).join('\r\n')],{type:'text/csv;charset=utf-8'}));let a=document.createElement('a');a.href=u;a.download='Volleyball.csv';a.click();setTimeout(()=>URL.revokeObjectURL(u),2000)};
const colors=[['#b64040','#d6a52c','#43875a','#17573a'],['#b64040','#d6a52c','#43875a','#6583a2'],['#43875a','#b64040'],['#b64040','#d6a52c','#43875a'],['#b64040','#d6a52c','#43875a']];
function charts(){$("matchReport").textContent=(match.name||"Spiel ohne Namen")+" · "+(match.home===""?"–":match.home)+" : "+(match.away===""?"–":match.away);$("personReport").textContent=$("who").selectedOptions[0]?.textContent||"Gesamte Mannschaft";let v=$('who').value,r=v==='all'?f.map((s,j)=>d.reduce((n,a)=>n+a[j],0)):(d[Number(v)]||zero());$('summary').textContent=r.reduce((a,b)=>a+b,0)+' erfasste Aktionen · Anteile je Kategorie';let offset=0;$('charts').innerHTML=g.map(([name,labels],k)=>{let vals=r.slice(offset,offset+labels.length);offset+=labels.length;let total=vals.reduce((a,b)=>a+b,0);let pct=x=>total?Math.round(x/total*100):0;return '<article class="chart"><h3>'+name+' · '+total+'</h3><div class="bar">'+vals.map((x,j)=>'<span style="background:'+colors[k][j]+';width:'+(total?x/total*100:0)+'%"></span>').join('')+'</div>'+labels.map((l,j)=>'<div class="metric"><span><span style="color:'+colors[k][j]+'">●</span> '+l+'</span><strong>'+vals[j]+' · '+(total?pct(vals[j])+' %':'–')+'</strong></div><div class="bar"><span style="background:'+colors[k][j]+';width:'+(total?vals[j]/total*100:0)+'%"></span></div>').join('')+'</article>'}).join('')}
function view(report){$('capture').hidden=report;$('analysis').hidden=!report;$('entry').classList.toggle('active',!report);$('report').classList.toggle('active',report);if(report)charts()}
$('entry').onclick=()=>view(false);$('report').onclick=()=>view(true);$('who').onchange=charts;function syncMatch(){$("matchName").value=match.name;$("home").value=match.home;$("away").value=match.away}function saveMatch(){try{localStorage.setItem("volleyball-match-v1",JSON.stringify(match))}catch(e){}if(!$("analysis").hidden)charts()}syncMatch();[["matchName","name"],["home","home"],["away","away"]].forEach(([id,k])=>{$(id).oninput=()=>{match[k]=$(id).value;saveMatch()}});$("pdf").onclick=()=>{charts();window.print()};render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></html>
