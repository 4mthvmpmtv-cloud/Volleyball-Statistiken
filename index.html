<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Volleyball-Statistik</title><style>*{box-sizing:border-box}body{font:15px system-ui;background:#eef4ef;color:#173323;margin:10px}h1{background:#174b35;color:white;padding:12px;border-radius:10px;font-size:22px}button{font:inherit;touch-action:manipulation;border:1px solid #ccd9ce;border-radius:7px;padding:8px;background:white}table{border-spacing:0;min-width:1300px;width:100%;text-align:center}th,td{padding:4px;border:1px solid #d5e0d7;min-width:72px;background:white}th{background:#dce9df}tr>*:first-child{position:sticky;left:0;background:#e5eee6;z-index:2;text-align:left}.plus{background:#246b49;color:white;width:100%;min-height:44px;font-size:20px;font-weight:bold}.minus{width:100%;margin-top:3px;padding:4px;min-height:28px}.wrap{overflow:auto}nav{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}</style><h1>SV Lauchheim – Spielstatistik</h1><nav><button id="reset">Spiel zurücksetzen</button><button id="export">CSV exportieren</button><span id="status"></span></nav><p>Grün = +1. Minus = −1. Seitlich wischen für weitere Felder.</p><div class="wrap"><table id="board"></table></div><script>
const p=['Raffi','Leon','Samuel','Luis','Sophie','Annika','Laila'],g=[['Aufschlag',['Fehler','Mittel','Gut','ASS']],['Zuspiel',['Schlecht','Mittel','Gut','Erhalten']],['Angriff',['Erfolgreich','Erfolglos']],['Annahme',['Schlecht','Mittel','Gut']],['Block',['Schlecht','Angriff gelenkt','Killblock']]],f=g.flatMap(([n,a])=>a.map(s=>n+' - '+s)),blank=()=>p.map(()=>f.map(()=>0)),key='volleyball-v1',$=id=>document.getElementById(id);let d=blank();try{let s=JSON.parse(localStorage.getItem(key));if(s)d=blank().map((r,i)=>r.map((v,j)=>Math.max(0,Math.floor(Number(s[i]?.[j])||0))))}catch(e){}
$('board').innerHTML='<thead><tr><th rowspan="2">Spieler</th>'+g.map(([n,a])=>'<th colspan="'+a.length+'">'+n+'</th>').join('')+'</tr><tr>'+g.flatMap(([n,a])=>a.map(s=>'<th>'+s+'</th>')).join('')+'</tr></thead><tbody>'+p.map((n,i)=>'<tr><th>'+n+'</th>'+f.map((s,j)=>'<td><button class="plus" data-i="'+i+'" data-j="'+j+'" data-d="1"><span id="v'+i+'_'+j+'">0</span> +</button><button class="minus" data-i="'+i+'" data-j="'+j+'" data-d="-1">−</button></td>').join('')+'</tr>').join('')+'</tbody><tfoot><tr><th>Gesamt</th>'+f.map((s,j)=>'<td id="t'+j+'">0</td>').join('')+'</tr></tfoot>';
function refresh(){d.forEach((r,i)=>r.forEach((v,j)=>$('v'+i+'_'+j).textContent=v));f.forEach((s,j)=>$('t'+j).textContent=d.reduce((n,r)=>n+r[j],0));try{localStorage.setItem(key,JSON.stringify(d));$('status').textContent='Lokal gespeichert'}catch(e){$('status').textContent='Speicherung nicht verfügbar'}}
$('board').onclick=e=>{let b=e.target.closest('button[data-d]');if(!b)return;let {i,j,d:delta}=b.dataset;d[i][j]=Math.max(0,d[i][j]+Number(delta));refresh()};$('reset').onclick=()=>{if(confirm('Alle 112 Zähler auf 0 setzen?')){d=blank();refresh()}};$('export').onclick=()=>{let u=URL.createObjectURL(new Blob(['\uFEFF'+[['Spieler',...f],...p.map((n,i)=>[n,...d[i]])].map(r=>r.join(';')).join('\r\n')],{type:'text/csv;charset=utf-8'}));let a=document.createElement('a');a.href=u;a.download='Volleyball.csv';a.click();setTimeout(()=>URL.revokeObjectURL(u),2000)};refresh();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></html>
